<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1209" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: { ink: '#1a1209', paper: '#f5f0e8', cream: '#ede8dc', rust: '#b84c2a' },
            fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"DM Sans"', 'sans-serif'] },
            keyframes: {
              toastIn: { from: { opacity: 0, transform: 'translateY(12px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
              toastOut: { to: { opacity: 0, transform: 'translateY(12px)' } },
            },
          },
        },
      };
    </script>
    <script>
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>

    <script defer type="module" src="js/main.js"></script>
  </head>
  <body class="font-sans bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen transition-colors">
    <header class="bg-ink dark:bg-black text-paper px-8 py-6 flex items-center gap-4 shadow-lg sticky top-0 z-50">
      <span class="text-3xl">📚</span>
      <h1 class="font-serif text-2xl tracking-wide flex-1">Bookshelf App</h1>
      <button id="themeToggle" data-testid="themeToggleButton" class="border border-paper/40 text-sm px-3 py-1.5 rounded-lg hover:bg-paper/10 transition">🌓 Tema</button>
      <button id="exportButton" data-testid="exportButton" class="border border-paper/40 text-sm px-3 py-1.5 rounded-lg hover:bg-paper/10 transition">⬇ Export</button>
      <label class="border border-paper/40 text-sm px-3 py-1.5 rounded-lg hover:bg-paper/10 transition cursor-pointer">
        ⬆ Import
        <input id="importInput" data-testid="importInput" type="file" accept="application/json" class="hidden" />
      </label>
    </header>

    <main class="max-w-6xl mx-auto p-6 pb-16 grid md:grid-cols-[360px_1fr] gap-7">
      <section class="bg-white dark:bg-neutral-800 rounded-xl p-7 shadow-md md:col-start-1 md:row-start-1">
        <h2 class="font-serif text-xl text-amber-600 border-b-2 border-cream dark:border-neutral-700 pb-3 mb-5">Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm" class="space-y-4">
          <div>
            <label for="bookFormTitle" class="text-xs font-medium uppercase tracking-wide text-gray-400">Judul</label>
            <input id="bookFormTitle" type="text" required data-testid="bookFormTitleInput"
              class="w-full border border-cream dark:border-neutral-600 dark:bg-neutral-700 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <div>
            <label for="bookFormAuthor" class="text-xs font-medium uppercase tracking-wide text-gray-400">Penulis</label>
            <input id="bookFormAuthor" type="text" required data-testid="bookFormAuthorInput"
              class="w-full border border-cream dark:border-neutral-600 dark:bg-neutral-700 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <div>
            <label for="bookFormYear" class="text-xs font-medium uppercase tracking-wide text-gray-400">Tahun</label>
            <input id="bookFormYear" type="number" required data-testid="bookFormYearInput"
              class="w-full border border-cream dark:border-neutral-600 dark:bg-neutral-700 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-amber-500" />
            <p id="bookFormYearError" class="text-xs text-rust mt-1 hidden">Tahun tidak valid</p>
          </div>
          <div class="flex items-center gap-2">
            <input id="bookFormIsComplete" type="checkbox" data-testid="bookFormIsCompleteCheckbox" class="w-4 h-4 accent-amber-600" />
            <label for="bookFormIsComplete" class="text-sm text-gray-500 dark:text-gray-300">Selesai dibaca</label>
          </div>
          <button id="bookFormSubmit" type="submit" data-testid="bookFormSubmitButton"
            class="w-full bg-ink dark:bg-amber-600 text-paper py-3 rounded-lg font-medium hover:bg-amber-600 dark:hover:bg-amber-500 transition">
            Masukkan Buku ke rak <span>Belum selesai dibaca</span>
          </button>
        </form>
      </section>

      <section class="bg-white dark:bg-neutral-800 rounded-xl p-7 shadow-md md:col-start-1 md:row-start-2">
        <h2 class="font-serif text-xl text-amber-600 border-b-2 border-cream dark:border-neutral-700 pb-3 mb-5">Cari &amp; Urutkan</h2>
        <form id="searchBook" data-testid="searchBookForm" class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[140px]">
            <label for="searchBookTitle" class="text-xs font-medium uppercase tracking-wide text-gray-400">Judul</label>
            <input id="searchBookTitle" type="text" data-testid="searchBookFormTitleInput"
              class="w-full border border-cream dark:border-neutral-600 dark:bg-neutral-700 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <div>
            <label for="sortBy" class="text-xs font-medium uppercase tracking-wide text-gray-400">Urutkan</label>
            <select id="sortBy" data-testid="sortBySelect"
              class="w-full border border-cream dark:border-neutral-600 dark:bg-neutral-700 rounded-lg px-3 py-2 mt-1">
              <option value="id">Terbaru</option>
              <option value="title">Judul</option>
              <option value="author">Penulis</option>
              <option value="year">Tahun</option>
            </select>
          </div>
          <button id="searchSubmit" type="submit" data-testid="searchBookFormSubmitButton"
            class="bg-ink dark:bg-amber-600 text-paper px-5 py-2 rounded-lg hover:bg-amber-600 dark:hover:bg-amber-500 transition">
            Cari
          </button>
        </form>
      </section>

      <section class="bg-white dark:bg-neutral-800 rounded-xl p-7 shadow-md md:col-start-2 md:row-start-1">
        <h2 class="font-serif text-xl text-amber-600 border-b-2 border-cream dark:border-neutral-700 pb-3 mb-5">
          Belum selesai dibaca
          <span id="incompleteCount" class="inline-block bg-amber-600 text-white text-xs font-bold rounded-full px-2 py-0.5 ml-2 align-middle">0</span>
        </h2>
        <div id="incompleteBookList" data-testid="incompleteBookList"></div>
      </section>

      <section class="bg-white dark:bg-neutral-800 rounded-xl p-7 shadow-md md:col-start-2 md:row-start-2">
        <h2 class="font-serif text-xl text-amber-600 border-b-2 border-cream dark:border-neutral-700 pb-3 mb-5">
          Selesai dibaca
          <span id="completeCount" class="inline-block bg-amber-600 text-white text-xs font-bold rounded-full px-2 py-0.5 ml-2 align-middle">0</span>
        </h2>
        <div id="completeBookList" data-testid="completeBookList"></div>
      </section>
    </main>
  </body>
</html>
